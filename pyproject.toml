[project]
name = "zli"
version = "0.1.0"
description = "Zero-Latency Interface for DINO-WM: training orchestration and deployment"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "hydra-core>=1.2.0",
    "omegaconf>=2.3",
    "hydra-submitit-launcher>=1.2.0",
    "submitit>=1.5.1",
    "accelerate>=0.26.1",
    "wandb>=0.13.1",
    "einops>=0.4.1",
    "numpy>=1.26",
    "pillow>=10.3",
    "tqdm",
    "opencv-python>=4.6.0",
    "matplotlib>=3.5",
    "moviepy>=1.0.3",
    "scikit-image>=0.19",
    "scipy",
    "h5py>=3.11",
    "psutil",
    "tensorboard>=2.15",
    "transformers>=4.21",
    "huggingface-hub>=0.23",
]

[project.optional-dependencies]
deploy = [
    "pymunk",
    "pygame",
    "shapely",
]
sim = [
    "gym>=0.23.1",
    "mujoco>=3.2.7",
    "mujoco-py>=2.1.2.14",
    "dm-control>=1.0.27",
    "robomimic>=0.2.0",
    "robosuite>=1.4.1",
    "d4rl>=1.1",
    "mani-skill",
    "gymnasium>=0.29",
]
video = ["decord>=0.6.0", "imageio>=2.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["training*", "deployment*"]
